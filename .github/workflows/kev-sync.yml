name: Update KEV data

on:
  schedule:
    # Every 3 hours -- comfortably ahead of CISA's own twice-daily
    # (05:00 / 15:00 US Central) update cadence, and frequent enough to
    # capture VulnCheck/KEVIntel's early-warning listings same-day.
    - cron: "0 */3 * * *"
    # EPSS-refresh run -- 14:30 UTC, an hour after FIRST.org's own daily
    # publish (~13:30 UTC). EPSS only changes once/day, so this is the
    # only trigger that re-downloads it (see REFRESH_EPSS below); the
    # rest of the build still runs same as any other scheduled trigger.
    - cron: "30 14 * * *"
  workflow_dispatch: {}

concurrency:
  group: kevs-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # cve.org lookups for CVEs new to the cache are rate-limited (5/30s
    # unauthenticated, 50/30s with a CVE Services API key) and capped per
    # run via CVE_METADATA_MAX_PER_RUN -- a large initial backfill spreads
    # across several scheduled runs rather than running in one. This is a
    # safety net, not the expected steady-state duration.
    timeout-minutes: 240
    steps:
      - name: Checkout kevs
        uses: actions/checkout@v4

      # actions/checkout resolves main to whatever SHA it was at TRIGGER
      # time, not at actual job-start time. With concurrency queuing a run
      # behind a long (multi-hour) previous run, that pinned SHA is stale
      # by the time this job actually starts -- so data/cve_metadata_cache.json
      # here may be missing entries the previous run already committed,
      # and pushing our own commit later would either waste API calls
      # re-fetching those or (worse) get rejected as a non-fast-forward
      # push. Sync to whatever main actually is right now, before doing
      # any work -- concurrency guarantees no other push can land between
      # this and our own push later, since the whole workflow serializes
      # on the same group.
      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build KEV dataset
        env:
          VULNCHECK_API_KEY: ${{ secrets.VULNCHECK_API_KEY }}
          KEVINTEL_API_KEY: ${{ secrets.KEVINTEL_API_KEY }}
          # Optional -- unset until a CVE Services (CNA-sponsored) account
          # exists. Leaving these empty just keeps cve.org lookups on the
          # slower unauthenticated rate limit.
          CVE_API_KEY: ${{ secrets.CVE_API_KEY }}
          CVE_API_ORG: ${{ secrets.CVE_API_ORG }}
          CVE_API_USER: ${{ secrets.CVE_API_USER }}
          # Free, instant self-serve signup (unlike CVE_API_KEY above) --
          # raises the NVD vendor/product fallback lookup rate limit from
          # 5/30s to 50/30s.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # True on the dedicated 14:30 UTC daily schedule, or any manual
          # run (so a manual trigger can also force a fresh EPSS pull).
          REFRESH_EPSS: ${{ github.event.schedule == '30 14 * * *' || github.event_name == 'workflow_dispatch' }}
        run: python scripts/build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/kevs.json docs/data/meta.json data/cve_metadata_cache.json data/epss_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update KEV data"
            git push
          fi
