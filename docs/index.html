<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KEV Cross-Catalog Viewer</title>
  <meta name="description" content="A free, serverless viewer that cross-references CISA, ENISA, CIRCL, KEVIntel, and VulnCheck Known Exploited Vulnerabilities catalogs -- filter and sort by CVE, CVSS, Active Since, vendor, and product.">

  <link href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/css/tabulator.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div>
      <h1>KEV Cross-Catalog Viewer</h1>
      <p id="subtitle">Compare Known Exploited Vulnerabilities coverage across CISA, ENISA, CIRCL, KEVIntel, and VulnCheck.</p>
    </div>
    <div id="header-right">
      <div id="status">Loading...</div>
      <div id="share-links">
        Share:
        <a id="share-x" href="#" target="_blank" rel="noopener">X</a>
        <a id="share-linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a>
        <a id="share-reddit" href="#" target="_blank" rel="noopener">Reddit</a>
        <a id="share-whatsapp" href="#" target="_blank" rel="noopener">WhatsApp</a>
      </div>
    </div>
  </header>
  <div class="toolbar">
    <span id="filter-count"></span>
    <span id="legend">✓ links directly to that catalog's page for the CVE. A highlighted cell marks whichever catalog listed it earliest.</span>
    <span id="excluded-catalogs"></span>
    <button id="reset-view-btn" class="toolbar-btn" type="button" title="Clear all filters, sorting, excluded catalogs, and column visibility">Reset</button>
    <div id="column-toggle-wrap">
      <button id="column-toggle-btn" class="toolbar-btn" type="button">Columns ▾</button>
      <div id="column-toggle-panel" hidden></div>
    </div>
    <button id="export-csv" class="toolbar-btn">Export CSV</button>
    <span id="export-status"></span>
  </div>
  <div id="kev-table"></div>

  <footer>
    <a href="https://www.macnica.co.jp/business/security/manufacturers/anteras/" target="_blank" rel="noopener" title="Macnica ANTERAS">
      <img src="images/anteras-logo.png" alt="Macnica ANTERAS" id="anteras-logo">
    </a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
